name: Verify showcase

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-showcase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Showcase integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify public content and static assets
        run: python3 scripts/verify_showcase.py
